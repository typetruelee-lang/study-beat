<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <!-- 몰입각 app icon: the clay mascot in headphones, eyes locked in "focus mode". Square, full-bleed (no rounded corners: Toss rounds it). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F08A5D"/>
      <stop offset="1" stop-color="#D9532C"/>
    </linearGradient>
    <radialGradient id="skin" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.45" stop-color="#FFF3E6"/>
      <stop offset="1" stop-color="#F2D6BE"/>
    </radialGradient>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4A4E6B"/>
      <stop offset="1" stop-color="#2C2F45"/>
    </linearGradient>
    <radialGradient id="cup" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#5D6287"/>
      <stop offset="1" stop-color="#2C2F45"/>
    </radialGradient>
    <radialGradient id="leaf" cx="0.4" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#A9DDB0"/>
      <stop offset="1" stop-color="#6AA874"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#7A2A10" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="600" height="600" fill="url(#bg)"/>
  <!-- sound rings -->
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round" opacity="0.35">
    <path d="M92 250 q-34 60 0 120" stroke-width="16"/>
    <path d="M52 220 q-52 90 0 180" stroke-width="12" opacity="0.6"/>
    <path d="M508 250 q34 60 0 120" stroke-width="16"/>
    <path d="M548 220 q52 90 0 180" stroke-width="12" opacity="0.6"/>
  </g>
  <g filter="url(#soft)">
    <!-- sprout -->
    <path d="M300 168 q-4 -26 0 -44" stroke="#5E9A68" stroke-width="10" stroke-linecap="round" fill="none"/>
    <ellipse cx="270" cy="118" rx="34" ry="18" transform="rotate(-25 270 118)" fill="url(#leaf)"/>
    <ellipse cx="330" cy="112" rx="34" ry="18" transform="rotate(25 330 112)" fill="url(#leaf)"/>
    <!-- head -->
    <circle cx="300" cy="330" r="168" fill="url(#skin)"/>
    <!-- headphone band -->
    <path d="M128 318 C128 168 472 168 472 318" stroke="url(#band)" stroke-width="30" fill="none" stroke-linecap="round"/>
    <!-- ear cups -->
    <rect x="96" y="276" width="78" height="128" rx="36" fill="url(#cup)"/>
    <rect x="426" y="276" width="78" height="128" rx="36" fill="url(#cup)"/>
    <rect x="160" y="296" width="18" height="88" rx="9" fill="#E2683F"/>
    <rect x="422" y="296" width="18" height="88" rx="9" fill="#E2683F"/>
  </g>
  <!-- determined brows + locked-in eyes (몰입 각) -->
  <path d="M222 276 l50 14" stroke="#4A3A33" stroke-width="12" stroke-linecap="round"/>
  <path d="M378 276 l-50 14" stroke="#4A3A33" stroke-width="12" stroke-linecap="round"/>
  <path d="M226 318 h44" stroke="#4A3A33" stroke-width="13" stroke-linecap="round"/>
  <path d="M330 318 h44" stroke="#4A3A33" stroke-width="13" stroke-linecap="round"/>
  <!-- cheeks -->
  <ellipse cx="220" cy="366" rx="26" ry="16" fill="#F6A79A" opacity="0.8"/>
  <ellipse cx="380" cy="366" rx="26" ry="16" fill="#F6A79A" opacity="0.8"/>
  <!-- small serious mouth -->
  <path d="M286 380 h28" stroke="#4A3A33" stroke-width="9" stroke-linecap="round"/>
</svg>
